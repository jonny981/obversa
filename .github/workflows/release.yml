name: Release

# A v* tag runs the verification record only. The release owner publishes from
# the exact gate-passed commit with scripts/release.mjs after approving the
# destination.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make the main ref available to the page-shape check
        run: git fetch origin main:main || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:d15
