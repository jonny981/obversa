name: Release

# The release act is a manual dispatch on main. Before dispatch, create the
# `release` environment and require a reviewer for it. The one job waits for
# that approval, installs, then checks the release commit before anything
# builds or publishes. The check replaces a second run of the proof chain: the
# commit's parent passed CI on GitHub, and the commit changes only versions,
# changelogs, the package table and deleted changesets
# (scripts/check-release-commit.mjs). `changeset publish` releases every
# workspace version that is not yet on the registry and tags each published
# package `name@version`; the job pushes those tags.
#
# The job does not wait for npm to show the new versions, which takes
# minutes. Confirm the release afterwards by reading every version back from
# the registry: node scripts/verify-published.mjs
#
# Credentials: the publish job holds the only OIDC grant (`id-token: write`)
# for npm trusted publishing. Until a trusted publisher is configured for a
# package — impossible before its first release — npm falls back to
# NODE_AUTH_TOKEN if the repository carries that secret. No other job sees
# either credential.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # push the name@version tags changesets creates
      actions: read # read the parent commit's CI run
      id-token: write # npm trusted publishing
    env:
      # The explicit release act the prepublishOnly hook requires.
      OBVERSA_RELEASE: "1"
      # pnpm packs each tarball itself, then delegates the upload to npm.
      # npm-path selects the root-pinned devDependency — never whichever npm
      # is first on PATH — so the checked pin below is the real publisher.
      npm_config_npm_path: ${{ github.workspace }}/node_modules/.bin/npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check the release commit changes only release files and its parent passed CI
        run: node scripts/check-release-commit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The checkout is fresh: the tarballs pnpm packs need the built output.
      - run: pnpm build
      - name: Prove the publish client is the pinned npm on a trusted-publishing-capable Node
        run: |
          node -e 'const [maj, min] = process.versions.node.split(".").map(Number); if (maj < 22 || (maj === 22 && min < 14)) throw new Error(`npm trusted publishing needs Node >= 22.14.0, got ${process.versions.node}`)'
          PINNED=$(node -p "require('./package.json').devDependencies.npm")
          ACTUAL=$("$npm_config_npm_path" --version)
          if [ "$ACTUAL" != "$PINNED" ]; then
            echo "npm-path resolved npm $ACTUAL; expected the pinned $PINNED"
            exit 1
          fi
          echo "publish client: npm $ACTUAL (root devDependency, selected via npm-path) on node $(node --version)"
      # Changesets makes annotated tags (`git tag -m`), which need a tagger,
      # and it discards git's error when one fails, so a checkout without an
      # identity uploads every package and tags none.
      - name: Give git a tagger identity for the release tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
      # The tag step pushes a tag missing from this list without reading the
      # registry: this run's publish created it.
      - name: List the tags that exist before the publish
        run: git tag --list > "$RUNNER_TEMP/tags-before-publish"
      - name: Publish the unpublished workspace versions
        run: pnpm changeset publish
        env:
          # Trusted publishing needs no token. For a package's first release —
          # before its trusted publisher can exist — npm uses this if the
          # repository carries the secret; otherwise the OIDC exchange runs.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Every intended name@version tag is pushed by name, never --tags. A
      # tag this run's publish created is pushed at once; any other tag waits
      # until the registry shows its version. A registry-confirmed version
      # whose tag is missing (a retried publish skips them) fails here with its
      # recovery: tag the commit that published it, never a moved HEAD.
      - name: Push every published version's tag
        run: node scripts/tag-published.mjs --tags-before "$RUNNER_TEMP/tags-before-publish"
