name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack (pinned pnpm)
        run: corepack enable
      - name: Install (frozen, offline-capable)
        run: pnpm install --frozen-lockfile
      - name: Typecheck (tsc)
        run: pnpm typecheck
      - name: Typecheck (tsc6)
        run: pnpm typecheck:ts6
      - name: Build every package
        run: pnpm build
      - name: Unit tests
        run: pnpm test

  checks:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack (pinned pnpm)
        run: corepack enable
      - name: Install (frozen)
        run: pnpm install --frozen-lockfile
      - name: Build every package
        run: pnpm build
      - name: Package boundaries and dependency direction
        run: pnpm check:boundaries
      - name: Graph kernel purity
        run: pnpm check:graph-purity
      - name: Packed files match the expected list
        run: pnpm check:tarballs
      - name: Package manifests
        run: pnpm check:packages
      - name: Publish allowlist audit
        run: pnpm check:publish
      - name: Clean consumer
        run: pnpm check:consumer
      - name: Documentation build
        run: pnpm docs:validate
