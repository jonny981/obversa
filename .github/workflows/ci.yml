name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make the main branch available to repository checks
        run: git fetch origin main:main || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack (pinned pnpm)
        run: corepack enable
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Proof chain
        run: pnpm verify:d2
      - name: Packed files match the expected list
        run: pnpm check:tarballs
